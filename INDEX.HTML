<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Kit - Help Desk</title>
    <link rel="stylesheet" href="STYLE.CSS">
</head>
<body>

<div class="container">

    <h1>Librería de Componentes UI - Help Desk</h1>

    <!-- BOTONES -->
    <div class="section">

        <h2>Botones</h2>

        <button class="btn btn-primary">Crear Ticket</button>
        <button class="btn btn-secondary">Actualizar Ticket</button>
        <button class="btn btn-danger">Eliminar Ticket</button>

    </div>


    <!-- FORMULARIOS -->
    <div class="section">

        <h2>Formulario de Incidentes</h2>

        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" placeholder="Ingrese su nombre">

        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" placeholder="Ingrese su correo">

        <label for="prioridad">Prioridad</label>
        <select id="prioridad">
            <option>Alta</option>
            <option>Media</option>
            <option>Baja</option>
        </select>

        <label for="descripcion">Descripción del incidente</label>
        <textarea id="descripcion" rows="4" placeholder="Describa el problema"></textarea>

        <button class="btn btn-primary">Enviar Ticket</button>

    </div>


    <!-- TARJETAS -->
    <div class="section">

        <h2>Tickets Registrados</h2>

        <div class="card">
            <h3>Ticket #001</h3>
            <p>Error en el acceso al sistema.</p>
        </div>

        <div class="card">
            <h3>Ticket #002</h3>
            <p>Problema con la conexión a internet.</p>
        </div>

    </div>


    <!-- BADGES -->
    <div class="section">

        <h2>Prioridades</h2>

        <span class="badge alta">Alta</span>
        <span class="badge media">Media</span>
        <span class="badge baja">Baja</span>

    </div>

</div>

</body>
</html>
